name: Build Android APK (مدرستي)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble Debug APK (JDK 17 / Gradle 8.10.2 / AGP 8.7.2 / SDK 35)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle 8.10.2, AGP 8.7.2, compileSdk 35 & Keystore for CI
        run: |
          # 1. Align Gradle Wrapper to 8.10.2
          sed -i 's|gradle-.*-bin.zip|gradle-8.10.2-bin.zip|g' gradle/wrapper/gradle-wrapper.properties

          # 2. Align AGP 8.7.2 and compatible Kotlin/KSP/CoreKtx versions in libs.versions.toml for Gradle 8.10.2 + SDK 35
          sed -i 's/agp = ".*"/agp = "8.7.2"/' gradle/libs.versions.toml
          sed -i 's/coreKtx = ".*"/coreKtx = "1.15.0"/' gradle/libs.versions.toml
          sed -i 's/kotlin = ".*"/kotlin = "2.0.21"/' gradle/libs.versions.toml
          sed -i 's/googleDevtoolsKsp = ".*"/googleDevtoolsKsp = "2.0.21-1.0.28"/' gradle/libs.versions.toml
          sed -i 's/googleServices = ".*"/googleServices = "4.4.2"/' gradle/libs.versions.toml

          # 3. Align compileSdk 35 and targetSdk 35 in app/build.gradle.kts and ensure org.jetbrains.kotlin.android plugin is applied for AGP 8.7.2
          sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/' app/build.gradle.kts
          sed -i 's/targetSdk = 36/targetSdk = 35/' app/build.gradle.kts
          if ! grep -q 'id("org.jetbrains.kotlin.android")' app/build.gradle.kts; then
            sed -i 's/alias(libs.plugins.android.application)/alias(libs.plugins.android.application)\n  id("org.jetbrains.kotlin.android") version "2.0.21"/' app/build.gradle.kts
          fi

          # 4. Ensure debug.keystore is present for debug signingConfig
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 5. Ensure ./gradlew executable exists
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: madrasati-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
